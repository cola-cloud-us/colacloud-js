version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
      semver-major-days: 30
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      routine:
        update-types: [minor, patch]
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
    groups:
      actions:
        patterns: ['*']
